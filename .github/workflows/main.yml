name: fantastic devs

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.ddev/**'
      - 'storage/backups/**/*'

jobs:

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        id: setup-php
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath
      - run: git config --global --add safe.directory /app
      - run: composer install --no-scripts --no-interaction --no-dev --working-dir=backend
      - uses: appleboy/scp-action@v1
        with:
          host: 164.90.255.195
          port: 22
          username: ubuntu
          key: ${{ secrets.GIT_KEY }}
          source: './backend'
          target: '/var/www/fantasticdevs'
          tar_tmp_path: '~/tmp/tar'
          overwrite: true
      - uses: appleboy/ssh-action@v1
        with:
          host: 164.90.255.195
          port: 22
          username: ubuntu
          key: ${{ secrets.GIT_KEY }}
          script: |
            cd /var/www/fantasticdevs/backend
            php craft db/backup storage/backups/rollback.sql --overwrite --interactive=0
            bash backup.sh
            php craft migrate/all --interactive=0
            php craft project-config/apply
            php craft clear-caches/data
            php craft clear-caches/temp-files
            sudo chmod 0664 .
            sudo find . -type f -exec chmod 0664 {} +
            sudo find . -type d -exec chmod 0774 {} +
            sudo chown -R ubuntu:www-data .

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GHA_AUTH }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend && npm ci --no-audit --legacy-peer-deps
      - run: cd frontend && npx nuxt build --preset github_pages --non-interactive
        env:
          NUXT_ENV: 'prod'
          NUXT_SITE_NAME: 'Fantastic Devs'
          NUXT_BASE_URL: ${{ vars.NUXT_BASE_URL }}
          NUXT_CRAFT_URL: ${{ vars.NUXT_CRAFT_URL }}
          NUXT_TURNSTILE_KEY: ${{ vars.NUXT_TURNSTILE_KEY }}
          NUXT_GRAPHQL_TOKEN: ${{ secrets.NUXT_GRAPHQL_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/.output/public
      - uses: actions/deploy-pages@v4
        id: deployment

